<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barcode / QR Code Generator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#D70051">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barcode QR">
<script src="JsBarcode.all.min.js"></script>
<script src="qrcode.min.js"></script>
<style>
  :root { --brand: #D70051; --brand-dark: #C80850; --gray: #6A737B; --line: #E7E6E6; color-scheme: light; }
  body { font-family: "Malgun Gothic", system-ui, sans-serif; font-size: 14px; max-width: 640px; margin: 0 auto; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 2rem max(16px, env(safe-area-inset-left, 0px)); color: #222; background: #fff; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0; border-bottom: 2px solid #222; margin-bottom: 1.5rem; }
  header::before { content: ""; width: 36px; height: 20px; background: var(--brand); }
  h1 { font-size: 1.3rem; color: var(--gray); margin: 0 0 1rem; }
  fieldset { border: 1px solid var(--line); border-radius: 4px; padding: 1rem; margin-bottom: 1rem; }
  legend { color: var(--brand); font-weight: bold; padding: 0 .3rem; }
  label { display: block; margin: .4rem 0; }
  input[type=radio] { accent-color: var(--brand); }
  input[type=number] { font: inherit; padding: .35rem .5rem; width: 10rem; border: 1px solid var(--line); border-radius: 4px; }
  input[type=number]:focus { outline: 2px solid var(--brand); border-color: transparent; }
  button { font: inherit; font-weight: bold; color: #fff; background: var(--brand); border: 0; border-radius: 4px; padding: .5rem 1.4rem; cursor: pointer; }
  button:hover { background: var(--brand-dark); }
  [hidden] { display: none !important; }
  #out { display: none; text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 1.5rem; }
  .tab { background: #fff; color: var(--gray); font-weight: normal; border-radius: 0; padding: .4rem 1.4rem; }
  .tab:hover { background: #fff; color: var(--brand); }
  .tab.active { background: var(--brand); color: #fff; font-weight: bold; }
  .panel { display: flex; justify-content: center; }
  #barcode { max-width: 100%; }
  #qr { width: 180px; height: 180px; }
  .err { color: var(--brand); margin-left: .8rem; }
  #label { font-size: 1.1rem; font-weight: bold; color: var(--brand); margin: 1rem 0 0; }
</style>
</head>
<body>
<header></header>
<h1>Barcode / QR Code Generator</h1>

<form id="form">
  <fieldset>
    <legend>Code type</legend>
    <label><input type="radio" name="type" value="deposit" checked> Deposit</label>
    <label><input type="radio" name="type" value="dispense"> Dispense</label>
  </fieldset>
  <fieldset id="amountBox" hidden>
    <legend>Amount</legend>
    <input type="number" id="amount" min="1" step="1" inputmode="numeric" placeholder="e.g. 100">
  </fieldset>
  <button type="submit">Generate</button>
  <span id="err" class="err"></span>
</form>

<div id="out">
  <div class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="barcode">Barcode</button>
    <button type="button" class="tab" data-tab="qr">QR Code</button>
  </div>
  <div class="panel" id="panel-barcode"><svg id="barcode"></svg></div>
  <div class="panel" id="panel-qr" hidden><div id="qr"></div></div>
  <p id="label"></p>
</div>

<script>
  const form = document.getElementById('form');
  const amountBox = document.getElementById('amountBox');
  const amount = document.getElementById('amount');
  const err = document.getElementById('err');
  const out = document.getElementById('out');
  const qr = new QRCode(document.getElementById('qr'), { width: 180, height: 180 });

  form.type.forEach(r => r.addEventListener('change', () => {
    amountBox.hidden = form.type.value !== 'dispense';
    amount.required = !amountBox.hidden;
  }));

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    document.querySelectorAll('.panel').forEach(p => p.hidden = p.id !== 'panel-' + t.dataset.tab);
  }));

  form.addEventListener('submit', e => {
    e.preventDefault();
    err.textContent = '';
    let text, label;
    if (form.type.value === 'deposit') {
      text = 'DEPOSIT';
      label = 'Deposit';
    } else {
      const n = amount.value.trim();
      if (!/^\d+$/.test(n) || Number(n) < 1) { err.textContent = 'Enter a positive whole amount.'; return; }
      text = n + 'DISPENSE';
      label = 'Dispense · ' + Number(n).toLocaleString('en-US');
    }
    document.getElementById('label').textContent = label;
    JsBarcode('#barcode', text, { format: 'CODE128', height: 80, displayValue: false });
    qr.makeCode(text);
    out.style.display = 'block';
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
